<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- ✅ Prevent auto-zoom, disable user scaling for app-like feel -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Safarnama — Your Shared Story Timeline</title>
    <meta name="description" content="Safarnama is a shared digital timeline to store and relive your memories together." />

    <!-- ✅ Open Graph / Social sharing -->
    <meta property="og:title"        content="Safarnama — Your Shared Story Timeline" />
    <meta property="og:description"  content="Store and relive your most precious memories with the people you love." />
    <meta property="og:image"        content="https://app-safarnama.vercel.app/og-image.jpg" />
    <meta property="og:url"          content="https://app-safarnama.vercel.app" />
    <meta property="og:type"         content="website" />
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="Safarnama — Your Shared Story Timeline" />
    <meta name="twitter:description" content="Store and relive your most precious memories with the people you love." />
    <meta name="twitter:image"       content="https://app-safarnama.vercel.app/og-image.jpg" />

    <!-- ✅ iOS PWA — feels like native app -->
    <meta name="apple-mobile-web-app-capable"          content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title"            content="Safarnama" />
    <meta name="mobile-web-app-capable"                content="yes" />

    <!-- ✅ Google Fonts for Classy/Editorial Aesthetic -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Figtree:ital,wght@0,300..900;1,300..900&family=Tangerine:wght@400;700&display=swap" rel="stylesheet">

    <link rel="icon"     type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#f43f5e" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="text-align:center;padding:40px;font-family:sans-serif">
        <h2>Safarnama</h2>
        <p>Please enable JavaScript to use Safarnama.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
